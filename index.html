<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BAMC 卫星云图</title>
<style>
:root{color-scheme:light;--bg:#ffffff;--panel:#ffffff;--panel2:#f4f7fa;--line:#d9e2ec;--text:#102a43;--muted:#627d98;--cyan:#1e7bb8;--lime:#2f9e44;--amber:#b7791f}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px clamp(14px,3vw,38px);border-bottom:1px solid var(--line);background:#ffffffd9;position:sticky;top:0;z-index:3;backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:12px}.logo-placeholder{height:42px;width:42px;border-radius:12px;border:1px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:10px}.brand h1{font-size:20px;margin:0;letter-spacing:-.02em}.brand .bamc{color:#0066cc;font-weight:900}.brand .sat{color:var(--cyan);font-weight:900}
.top-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.clock{font-variant-numeric:tabular-nums;color:var(--cyan);font-size:14px;font-family:"Courier New",monospace;font-weight:700;letter-spacing:1px;text-shadow:0 0 6px rgba(30,123,184,.3)}
main{max-width:1500px;margin:auto;padding:24px clamp(12px,2.8vw,34px) 38px}.hero{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:18px;flex-wrap:wrap}.hero h2{font-size:clamp(23px,3vw,34px);line-height:1.12;margin:0 0 8px;letter-spacing:-.035em}.hero p{max-width:740px;color:var(--muted);margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap}button,a.button{border:1px solid var(--line);background:#f0f4f8;color:var(--text);padding:10px 13px;border-radius:9px;font:inherit;font-size:13px;font-weight:650;text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;touch-action:manipulation}button.primary,a.button.primary{background:var(--cyan);color:#ffffff;border-color:var(--cyan)}button:hover,a.button:hover{filter:brightness(1.1)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 295px;gap:15px;align-items:start}.panel{border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden;box-shadow:0 14px 38px #0002}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line);flex-wrap:wrap}.panel-head h3{font-size:14px;margin:0}.muted{color:var(--muted);font-size:11px}.viewer{position:relative;background:var(--panel2);min-height:400px;display:grid;place-items:center;overflow:hidden}.image-wrap{width:100%;min-height:400px;display:grid;place-items:center;background:var(--panel2);position:relative}.image-wrap img{display:block;width:100%;height:auto;max-height:70vh;object-fit:contain;min-height:250px}.image-wrap .placeholder{padding:38px 20px;text-align:center;color:var(--muted)}.overlay-tag{position:absolute;left:13px;top:13px;padding:6px 9px;border-radius:7px;background:#ffffffd9;border:1px solid var(--line);font-size:11px;z-index:1}.overlay-tag.right{left:auto;right:13px}.img-footer{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:11px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}.side{display:grid;gap:13px}.controls{padding:15px}.controls h3{font-size:14px;margin:0 0 14px}.field{display:grid;gap:6px;margin-bottom:13px}.field label{color:var(--muted);font-size:11px}.field select,.field input{width:100%;padding:10px 11px;border-radius:8px;background:#ffffff;border:1px solid var(--line);color:var(--text);font:inherit;font-size:13px;min-width:0}.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}.full{width:100%}.hint{color:var(--muted);font-size:11px;margin:9px 0 0}.loadbar{height:2px;background:#e2e8f0}.loadbar span{display:block;height:100%;width:0;background:var(--cyan);transition:width .25s}
.error{display:none;margin:12px 14px;padding:10px;border:1px solid #e0b4b4;background:#fff5f5;border-radius:8px;color:#9b2c2c;font-size:12px}
.disclaimer{margin-top:24px;padding:20px 24px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;display:flex;justify-content:center;align-items:center;gap:40px;color:var(--muted);font-size:13px;flex-wrap:wrap}
.disclaimer-part{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.disclaimer-part strong{color:var(--text);font-size:14px;margin-bottom:2px}
.disclaimer-divider{width:1px;height:32px;background:var(--line)}

/* 安全区（刘海屏 / 圆角屏）适配，非移动端无影响 */
@supports(padding:max(0px)){
  header{padding-left:max(clamp(14px,3vw,38px),env(safe-area-inset-left));padding-right:max(clamp(14px,3vw,38px),env(safe-area-inset-right))}
  main{padding-left:max(clamp(12px,2.8vw,34px),env(safe-area-inset-left));padding-right:max(clamp(12px,2.8vw,34px),env(safe-area-inset-right))}
}

/* 中等屏幕：侧栏下移，避免被挤压 */
@media(max-width:960px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .side{grid-template-columns:1fr}
}

/* 手机端 */
@media(max-width:600px){
  header{position:static;padding:12px 14px;gap:10px}
  .brand{gap:9px}
  .brand h1{font-size:17px}
  .brand img{height:36px!important;width:36px!important}
  .top-right{justify-content:flex-end}
  .clock{display:none}
  main{padding:16px 12px 30px}
  .hero{gap:12px;margin-bottom:14px}
  .hero h2{font-size:clamp(20px,6.2vw,26px)}
  .hero .actions{width:100%}
  .hero .actions>*{flex:1}
  .actions button{padding:12px 14px}
  .panel{border-radius:12px}
  .panel-head{padding:11px 12px}
  .viewer,.image-wrap{min-height:240px}
  .image-wrap img{min-height:160px;max-height:58vh}
  .image-wrap .placeholder{padding:28px 16px}
  .overlay-tag{left:8px;top:8px;padding:5px 7px;font-size:10px}
  .overlay-tag.right{right:8px}
  .img-footer{padding:10px 12px}
  .controls{padding:14px 13px}
  /* 16px 可防止 iOS 聚焦输入框时自动放大页面 */
  .field select,.field input{font-size:16px;padding:11px 12px}
  .field{margin-bottom:12px}
  .controls button.full{padding:13px 14px}
  .disclaimer{flex-direction:column;gap:14px;text-align:center;padding:18px 16px;margin-top:20px}
  .disclaimer-divider{display:none}
}

/* 超窄屏：自定义经纬度改为单列，避免输入框过窄 */
@media(max-width:380px){
  .pair{grid-template-columns:1fr}
}

/* 触屏设备取消 hover 亮度变化带来的“粘滞”感 */
@media(hover:none){
  button:hover,a.button:hover{filter:none}
  button:active,a.button:active{filter:brightness(.94)}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <img src="bamc.png" alt="BAMC 标志" style="height:42px;width:42px;border-radius:12px;object-fit:contain;">
    <h1><span class="bamc">BAMC</span> <span class="sat">卫星云图</span></h1>
  </div>
  <div class="top-right"><span class="clock" id="clock">现在是 —</span></div>
</header>
<main>
  <section class="hero">
    <div><h2>云卷云舒，皆是天地之间的呼吸</h2></div>
    <div class="actions"><button class="primary" id="refresh">刷新图像</button></div>
  </section>
  <section class="layout">
    <div class="panel">
      <div class="panel-head"><h3 id="imageTitle">GeoColor</h3><span class="muted" id="imageStatus">等待加载</span></div>
      <div class="loadbar"><span id="loadbar"></span></div>
      <div class="viewer">
        <div class="overlay-tag" id="regionBadge">全球合成范围</div>
        <div class="overlay-tag right">LIVE IMAGE REQUEST</div>
        <div class="image-wrap" id="imageWrap"><div class="placeholder">正在请求 NOAA 图像服务…</div></div>
      </div>
      <div class="error" id="errorBox"></div>
      <div class="img-footer"><span id="requestInfo"></span><span>© NOAA / NESDIS</span></div>
    </div>
    <aside class="side">
      <div class="panel controls">
        <h3>图像请求设置</h3>
        <div class="field"><label for="product">数据产品</label><select id="product">
          <option value="recent">最新 GeoColor（近实时）</option>
          <option value="latest">最新 GeoColor（非时间图层）</option>
          <option value="archive">过去 24 小时档案</option>
        </select></div>
        <div class="field"><label for="region">显示区域</label><select id="region">
          <option value="americas">美洲</option>
          <option value="northamerica">北美洲与中美洲</option>
          <option value="global">全球视图</option>
          <option value="westpacific">西北太平洋</option>
          <option value="custom">自定义范围</option>
        </select></div>
        <div id="customBox" style="display:none">
          <div class="pair">
            <div class="field"><label for="xmin">最西经度</label><input id="xmin" type="number" value="100" min="-180" max="180"></div>
            <div class="field"><label for="xmax">最东经度</label><input id="xmax" type="number" value="180" min="-180" max="180"></div>
            <div class="field"><label for="ymin">最南纬度</label><input id="ymin" type="number" value="-10" min="-90" max="90"></div>
            <div class="field"><label for="ymax">最北纬度</label><input id="ymax" type="number" value="60" min="-90" max="90"></div>
          </div>
        </div>
        <div class="field"><label for="size">图像分辨率</label><select id="size">
          <option value="1200,675">1200 × 675（标准）</option>
          <option value="1600,900" selected>1600 × 900（高清）</option>
          <option value="2400,1350">2400 × 1350（大图）</option>
        </select></div>
        <button class="primary full" id="apply">获取卫星云图</button>
      </div>
    </aside>
  </section>
  <div class="disclaimer">
    <div class="disclaimer-part">
      <strong>数据来源</strong>
      <span>美国国家海洋和大气管理局 (NOAA) 公共图像服务，请合理控制请求频率。</span>
    </div>
  </div>
</main>
<script>
const services={
 recent:{url:"https://satellitemaps.nesdis.noaa.gov/arcgis/rest/services/Most_Recent_MERGEDGC/ImageServer",name:"Most Recent GeoColor",cadence:"约 10 分钟时间窗"},
 latest:{url:"https://satellitemaps.nesdis.noaa.gov/arcgis/rest/services/MERGED_GeoColor/ImageServer",name:"Latest GeoColor",cadence:"最新可用拼图"},
 archive:{url:"https://satellitemaps.nesdis.noaa.gov/arcgis/rest/services/MERGEDGC_Last_24hr/ImageServer",name:"GeoColor · 24h Archive",cadence:"滚动 24 小时档案"}
};
const regions={
 americas:{bbox:[-145,-55,-20,65],label:"美洲"},
 northamerica:{bbox:[-145,0,-35,65],label:"北美洲与中美洲"},
 global:{bbox:[-180,-60,180,70],label:"全球视图"},
 westpacific:{bbox:[100,-10,180,60],label:"西北太平洋"}
};
const $=id=>document.getElementById(id);
function bboxFromUI(){
 const r=$("region").value;
 if(r!=="custom")return regions[r].bbox;
 const b=[$("xmin").value,$("ymin").value,$("xmax").value,$("ymax").value].map(Number);
 if(b.some(v=>!Number.isFinite(v))||b[0]>=b[2]||b[1]>=b[3]||b[0]<-180||b[2]>180||b[1]<-90||b[3]>90)throw new Error("自定义经纬度范围无效，请检查经纬度上下限。");
 return b;
}
function buildUrl(){
 const p=services[$("product").value],b=bboxFromUI(),size=$("size").value;
 const q=new URLSearchParams({bbox:b.join(","),bboxSR:"4326",imageSR:"4326",size,format:"jpgpng",f:"image",pixelType:"U8",interpolation:"RSP_BilinearInterpolation"});
 return {url:p.url+"/exportImage?"+q.toString(),service:p,bbox:b,size};
}
function loadImage(){
 const wrap=$("imageWrap"),err=$("errorBox"),bar=$("loadbar");
 err.style.display="none";err.textContent="";bar.style.width="25%";$("imageStatus").textContent="正在请求 NOAA…";
 let req;
 try{req=buildUrl()}catch(e){err.textContent=e.message;err.style.display="block";$("imageStatus").textContent="参数错误";bar.style.width="0";return}
 const img=new Image();img.alt="NOAA NESDIS GeoColor satellite imagery";img.decoding="async";
 img.onload=()=>{
  wrap.replaceChildren(img);bar.style.width="100%";$("imageStatus").textContent="";
  $("imageTitle").textContent="GeoColor";
  const r=$("region").value;$("regionBadge").textContent=r==="custom"?"自定义范围":regions[r].label;
  bar.style.width="100%";
 };
 img.onerror=()=>{
  wrap.innerHTML='<div class="placeholder"><strong>图像获取失败</strong><br><br>请稍后重试。</div>';
  err.style.display="none";$("imageStatus").textContent="加载失败";bar.style.width="0";
 };
 img.src=req.url;
}
$("refresh").addEventListener("click",loadImage);$("apply").addEventListener("click",loadImage);
$("region").addEventListener("change",()=>{$("customBox").style.display=$("region").value==="custom"?"block":"none"});
function clock(){ $("clock").textContent="现在是 "+new Intl.DateTimeFormat("zh-CN",{hour12:false,dateStyle:"medium",timeStyle:"medium"}).format(new Date())}
clock();setInterval(clock,1000);loadImage();
</script>
</body>
</html>
