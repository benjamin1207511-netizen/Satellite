<style>
:root{color-scheme:light;--bg:#ffffff;--panel:#ffffff;--panel2:#f4f7fa;--line:#d9e2ec;--text:#102a43;--muted:#627d98;--cyan:#1e7bb8;--lime:#2f9e44;--amber:#b7791f}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px clamp(14px,3vw,38px);border-bottom:1px solid var(--line);background:#ffffffd9;position:sticky;top:0;z-index:3;backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:12px}.logo-placeholder{height:42px;width:42px;border-radius:12px;border:1px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:10px}.brand h1{font-size:20px;margin:0;letter-spacing:-.02em}.brand .bamc{color:#0066cc;font-weight:900}.brand .sat{color:var(--cyan);font-weight:900}
.top-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.clock{font-variant-numeric:tabular-nums;color:var(--cyan);font-size:14px;font-family:"Courier New",monospace;font-weight:700;letter-spacing:1px;text-shadow:0 0 6px rgba(30,123,184,.3)}
main{max-width:1500px;margin:auto;padding:24px clamp(12px,2.8vw,34px) 38px}.hero{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:18px;flex-wrap:wrap}.hero h2{font-size:clamp(23px,3vw,34px);line-height:1.12;margin:0 0 8px;letter-spacing:-.035em}.hero p{max-width:740px;color:var(--muted);margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap}button,a.button{border:1px solid var(--line);background:#f0f4f8;color:var(--text);padding:10px 13px;border-radius:9px;font:inherit;font-size:13px;font-weight:650;text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;touch-action:manipulation}button.primary,a.button.primary{background:var(--cyan);color:#ffffff;border-color:var(--cyan)}button:hover,a.button:hover{filter:brightness(1.1)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 295px;gap:15px;align-items:start}.panel{border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden;box-shadow:0 14px 38px #0002}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line);flex-wrap:wrap}.panel-head h3{font-size:14px;margin:0}.muted{color:var(--muted);font-size:11px}.viewer{position:relative;background:var(--panel2);min-height:400px;display:grid;place-items:center;overflow:hidden}.image-wrap{width:100%;min-height:400px;display:grid;place-items:center;background:var(--panel2);position:relative}.image-wrap img{display:block;width:100%;height:auto;max-height:70vh;object-fit:contain;min-height:250px}.image-wrap .placeholder{padding:38px 20px;text-align:center;color:var(--muted)}.overlay-tag{position:absolute;left:13px;top:13px;padding:6px 9px;border-radius:7px;background:#ffffffd9;border:1px solid var(--line);font-size:11px;z-index:1}.overlay-tag.right{display:none;left:auto;right:13px}.img-footer{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:11px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}.side{display:grid;gap:13px}.controls{padding:15px}.controls h3{font-size:14px;margin:0 0 14px}.field{display:grid;gap:6px;margin-bottom:13px}.field label{color:var(--muted);font-size:11px}.field select,.field input{width:100%;padding:10px 11px;border-radius:8px;background:#ffffff;border:1px solid var(--line);color:var(--text);font:inherit;font-size:13px;min-width:0}.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}.full{width:100%}.hint{color:var(--muted);font-size:11px;margin:9px 0 0}.loadbar{height:2px;background:#e2e8f0}.loadbar span{display:block;height:100%;width:0;background:var(--cyan);transition:width .25s}
.error{display:none;margin:12px 14px;padding:10px;border:1px solid #e0b4b4;background:#fff5f5;border-radius:8px;color:#9b2c2c;font-size:12px}
.disclaimer{margin-top:24px;padding:20px 24px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;display:flex;justify-content:center;align-items:center;gap:40px;color:var(--muted);font-size:13px;flex-wrap:wrap}
.disclaimer-part{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.disclaimer-part strong{color:var(--text);font-size:14px;margin-bottom:2px}
.disclaimer-divider{width:1px;height:32px;background:var(--line)}

/* 安全区（刘海屏 / 圆角屏）适配，非移动端无影响 */
@supports(padding:max(0px)){
  header{padding-left:max(clamp(14px,3vw,38px),env(safe-area-inset-left));padding-right:max(clamp(14px,3vw,38px),env(safe-area-inset-right))}
  main{padding-left:max(clamp(12px,2.8vw,34px),env(safe-area-inset-left));padding-right:max(clamp(12px,2.8vw,34px),env(safe-area-inset-right))}
}

/* 中等屏幕：侧栏下移，避免被挤压 */
@media(max-width:960px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .side{grid-template-columns:1fr}
}

/* 手机端 */
@media(max-width:600px){
  header{position:static;padding:12px 14px;gap:10px}
  .brand{gap:9px}
  .brand h1{font-size:17px}
  .brand img{height:36px!important;width:36px!important}
  .top-right{justify-content:flex-end}
  .clock{display:none}
  main{padding:16px 12px 30px}
  .hero{gap:12px;margin-bottom:14px}
  .hero h2{font-size:clamp(20px,6.2vw,26px)}
  .hero .actions{width:100%}
  .hero .actions>*{flex:1}
  .actions button{padding:12px 14px}
  .panel{border-radius:12px}
  .panel-head{padding:11px 12px}
  .viewer,.image-wrap{min-height:240px}
  .image-wrap img{min-height:160px;max-height:58vh}
  .image-wrap .placeholder{padding:28px 16px}
  .overlay-tag{left:8px;top:8px;padding:5px 7px;font-size:10px}
  .overlay-tag.right{display:none;right:8px}
  .img-footer{padding:10px 12px}
  .controls{padding:14px 13px}
  /* 16px 可防止 iOS 聚焦输入框时自动放大页面 */
  .field select,.field input{font-size:16px;padding:11px 12px}
  .field{margin-bottom:12px}
  .controls button.full{padding:13px 14px}
  .disclaimer{flex-direction:column;gap:14px;text-align:center;padding:18px 16px;margin-top:20px}
  .disclaimer-divider{display:none}
}

/* 超窄屏：自定义经纬度改为单列，避免输入框过窄 */
@media(max-width:380px){
  .pair{grid-template-columns:1fr}
}

/* 触屏设备取消 hover 亮度变化带来的“粘滞”感 */
@media(hover:none){
  button:hover,a.button:hover{filter:none}
  button:active,a.button:active{filter:brightness(.94)}
}

/* ==========================================================================
   以下为「手机专属」样式：只有当脚本判定为手机设备、给 <html> 加上 .is-mobile
   之后才会生效。电脑端不会添加该 class，因此电脑端页面完全不受影响。
   ========================================================================== */

/* 防止手机端出现横向滚动条 */
html.is-mobile,html.is-mobile body{overflow-x:hidden;}

/* 顶栏更紧凑，给图像留出更多空间 */
html.is-mobile header{padding:10px max(14px,env(safe-area-inset-left)) 10px max(14px,env(safe-area-inset-right));}
html.is-mobile .brand img,html.is-mobile .logo-placeholder{height:34px!important;width:34px!important;border-radius:9px;}
html.is-mobile .brand h1{font-size:16px;}
html.is-mobile .clock{font-size:11px;letter-spacing:.5px;text-shadow:none;}

/* 主体留白收紧 + 底部预留安全区 */
html.is-mobile main{padding:14px max(12px,env(safe-area-inset-left)) calc(30px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-right));}
html.is-mobile .hero{gap:10px;margin-bottom:12px;}
html.is-mobile .hero h2{font-size:clamp(19px,5.6vw,24px);}

/* 所有可点击元素不小于 44×44 的触控热区 */
html.is-mobile button,html.is-mobile a.button{min-height:44px;padding:11px 16px;}
html.is-mobile .controls button.full{min-height:48px;font-size:15px;}
html.is-mobile .field select,html.is-mobile .field input{font-size:16px;min-height:44px;padding:11px 12px;}

html.is-mobile .panel{border-radius:12px;box-shadow:0 8px 22px #00000012;}
html.is-mobile .panel-head{padding:10px 12px;}
html.is-mobile .panel-head h3{font-size:13px;}
html.is-mobile .controls{padding:14px 13px;}

/* 图像区：改用真实可视高度 --app-vh（由脚本实时写入），
   避免手机浏览器地址栏收起/展开时把图片裁掉 */
html.is-mobile .viewer,html.is-mobile .image-wrap{min-height:200px;}
html.is-mobile .image-wrap img{min-height:0;max-height:calc(var(--app-vh,1vh) * 56);object-fit:contain;cursor:zoom-in;}
html.is-mobile .image-wrap .placeholder{padding:26px 16px;}
html.is-mobile .overlay-tag{font-size:10px;padding:5px 7px;background:#ffffffcc;}
html.is-mobile .img-footer{padding:9px 12px;line-height:1.5;}
html.is-mobile .img-footer span{min-width:0;overflow-wrap:anywhere;}

/* 触屏不保留 hover 效果 */
html.is-mobile button:hover,html.is-mobile a.button:hover{filter:none;}
html.is-mobile button:active,html.is-mobile a.button:active{filter:brightness(.94);}

/* 全屏看图（点击图像打开） */
html.is-mobile .lightbox{
  position:fixed;inset:0;z-index:99;display:none;
  align-items:center;justify-content:center;
  background:rgba(6,14,24,.95);
  padding:calc(8px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left));
}
html.is-mobile .lightbox.open{display:flex;}
html.is-mobile .lightbox img{max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;}
html.is-mobile .lightbox-close{
  position:absolute;top:calc(10px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));
  width:42px;height:42px;min-height:42px;padding:0;border-radius:50%;
  border:1px solid #ffffff40;background:#ffffff1f;color:#fff;font-size:17px;
  display:grid;place-items:center;
}
html.is-mobile .lightbox-hint{
  position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));
  text-align:center;color:#ffffffa6;font-size:12px;pointer-events:none;
}
</style>

<script>
/* 极早执行的设备判定：在页面渲染前就决定是否启用手机端样式，避免闪动。
   判定依据：UA + 是否触屏 + 屏幕短边。
   电脑（含普通桌面浏览器）不会被加上 .is-mobile，因此桌面端样式完全不变。 */
(function(){
  var ua = navigator.userAgent || "";
  var isTouch = (navigator.maxTouchPoints || 0) > 0 || ("ontouchstart" in window);
  var uaMobile = /Android|webOS|iPhone|iPod|BlackBerry|IEMobile|Opera Mini|Mobile|HarmonyOS|Windows Phone/i.test(ua);
  var iPadOS = /Macintosh/.test(ua) && (navigator.maxTouchPoints || 0) > 1; // iPadOS 13+
  var shortSide = Math.min(window.screen && screen.width ? screen.width : 9999,
                           window.screen && screen.height ? screen.height : 9999);
  var isMobile = uaMobile || iPadOS || (isTouch && shortSide <= 820);
  var root = document.documentElement;
  root.className += (root.className ? " " : "") + (isMobile ? "is-mobile" : "is-desktop");
  window.__IS_MOBILE__ = isMobile;
})();
</script>

  {value:"hpi2",label:"瓦努阿图群岛（164.5°E–172°E，12.5°S–21.5°S）"},
  {value:"hpi3",label:"斐济群岛（175°E–176°W，14°S–21.5°S）"}
];
function populateRegions(){
  const sel=$("region");
  sel.innerHTML="";
  JMA_REGIONS.forEach(r=>{
    const o=document.createElement("option");
    o.value=r.value;o.textContent=r.label;sel.appendChild(o);
  });
  sel.value="fd_";
}
function pad(n){return String(n).padStart(2,"0")}
function floorToJmaInterval(date) {
  // JMA 文件时次按 UTC 的 10 分钟边界对齐，而不是按用户本地墙上时间取整。
  return new Date(Math.floor(date.getTime() / 600000) * 600000);
}
function selectedImageTime() {
  const input=$("imageTime").value;
  // datetime-local 按浏览器/用户设备当前时区解释；Date 会将其转换为同一个绝对时刻。
  const localDate=input ? new Date(input) : new Date(Date.now()-20*60000);
  if(Number.isNaN(localDate.getTime())) return null;
  return floorToJmaInterval(localDate);
}
function initializeImageTime() {
  // 默认取当前绝对时间前约 20 分钟，并按 UTC 的 10 分钟发布间隔向下对齐。
  const d=floorToJmaInterval(new Date(Date.now()-20*60000));
  // datetime-local 需要显示用户本地时间；用 ISO 字符串格式化偏移后的时间，避免时区偏移重复计算。
  const localInput=new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);
  $("imageTime").value=localInput;
}
function subtractTenMinutes(d) { return new Date(d.getTime()-10*60000); }
function timePath(d) {
  return `${d.getUTCFullYear()}/${pad(d.getUTCMonth()+1)}/${pad(d.getUTCDate())}/${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}00`;
}
function formatTime(d) {
  return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())} ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())} UTC`;
}
function jmaTimeCode(d) { return `${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}`; }
function populateProducts() {
  const sel=$("product");
  const previous=sel.value;
  sel.innerHTML="";
  const regularGroup=document.createElement("optgroup");
  regularGroup.label="常规区域产品";
  const targetGroup=document.createElement("optgroup");
  targetGroup.label="目标区域观测产品（TGB）";
  JMA_PRODUCTS.forEach(p=>{
    const o=document.createElement("option");o.value=p.value;o.textContent=p.label;
    (p.mode==="target"?targetGroup:regularGroup).appendChild(o);
  });
  sel.appendChild(regularGroup);sel.appendChild(targetGroup);
  if(JMA_PRODUCTS.some(p=>p.value===previous)) sel.value=previous;
  $("copyright").textContent="© JMA / Himawari";
  updateProductMode();
  updateProductNote();
}
function selectedProduct() {
  return JMA_PRODUCTS.find(p=>p.value===$("product").value)||JMA_PRODUCTS[0];
}
function updateProductMode() {
  const p=selectedProduct();
  const isTarget=p.mode==="target";
  $("regionField").style.display=isTarget?"none":"grid";
  $("targetAreaField").style.display=isTarget?"grid":"none";
  if(isTarget){
    $("sourceBadge").textContent="JMA 日本气象厅";
    $("regionBadge").textContent="JMA Target Area";
  }else{
    const region=JMA_REGIONS.find(r=>r.value===$("region").value)||JMA_REGIONS[0];
    $("sourceBadge").textContent="JMA 日本气象厅";
    $("regionBadge").textContent=region.label;
  }
}
function updateProductNote() {
  // 详细产品说明已按界面精简要求移除。
}
function jmaImageUrl(region, product, date) {
  const code=jmaTimeCode(date);
  const selected=JMA_PRODUCTS.find(p=>p.value===product)||JMA_PRODUCTS[0];
  // TGB 按用户提供的 JMA 官方格式固定使用后缀 _1：tga_irv_0000_1.jpg。
  if(selected.mode==="target"){
    const filename=`tga_${selected.code}_${code}_1.jpg`;
    return `https://ds.data.jma.go.jp/mscweb/data/himawari/img/tga/${filename}`;
  }
  // JMA 全球圆盘与分地区图像采用不同文件名前缀。
  const filename=region==="fd_" ? `fd__${product}_${code}.jpg` : `${region}_${product}_${code}.jpg`;
  return `${JMA_BASE}${region}/${filename}`;
}
function showError(message) {
  const wrap=$("imageWrap");
  wrap.innerHTML='<div class="placeholder"><strong>图像暂不可用</strong><br><br></div>';
  wrap.querySelector(".placeholder").append(document.createTextNode(message));
  $("errorBox").textContent=message;
  $("errorBox").style.display="block";
  $("imageStatus").textContent="图像暂不可用";
  $("loadbar").style.width="0";
}
function makeTargetAreaUrl(code, date, area) {
  return `https://ds.data.jma.go.jp/mscweb/data/himawari/img/tga/tga_${code}_${jmaTimeCode(date)}_${area}.jpg`;
}
function probeImage(url) {
  return new Promise(resolve=>{
    const probe=new Image();
    let settled=false;
    const finish=ok=>{
      if(settled)return;
      settled=true;
      probe.onload=null;probe.onerror=null;
      resolve(ok);
    };
    probe.onload=()=>finish(true);
    probe.onerror=()=>finish(false);
    probe.src=url+`?probe=${Date.now()}_${Math.random().toString(36).slice(2)}`;
  });
}
async function detectTargetAreas(product, date, token) {
  // 扫描连续编号范围；最终只显示实际能成功加载的编号，不将数量写死为 1 或 4。
  const maxProbe=20;
  const checks=await Promise.all(Array.from({length:maxProbe},(_,i)=>i+1).map(async area=>{
    const ok=await probeImage(makeTargetAreaUrl(product.code,date,area));
    return ok?area:null;
  }));
  if(token!==requestToken)return [];
  return checks.filter(area=>area!==null);
}
function updateTargetAreaOptions(areas) {
  const sel=$("targetArea");
  const previous=Number(sel.value);
  sel.innerHTML="";
  if(!areas.length){
    const o=document.createElement("option");
    o.value="";o.textContent="此时次未检测到可用区域";
    sel.appendChild(o);sel.disabled=true;return;
  }
  sel.disabled=false;
  areas.forEach(area=>{
    const o=document.createElement("option");
    o.value=String(area);o.textContent=`Target Area ${area}`;
    sel.appendChild(o);
  });
  sel.value=areas.includes(previous)?String(previous):String(areas[0]);
}
function displayImage(url, alt, token, date, displayRegion, product) {
  return new Promise(resolve=>{
    const img=new Image();
    img.alt=alt;
    img.style.width="100%";img.style.height="auto";img.style.objectFit="contain";img.style.display="block";
    img.onload=()=>{
      if(token!==requestToken){resolve(false);return;}
      $("imageWrap").innerHTML="";
      $("imageWrap").appendChild(img);
      $("imageStatus").textContent="已加载";
      $("loadbar").style.width="100%";
      $("requestInfo").textContent=`${formatTime(date)} · ${displayRegion}`;
      $("errorBox").style.display="none";
      resolve(true);
    };
    img.onerror=()=>{
      if(token!==requestToken){resolve(false);return;}
      resolve(false);
    };
    img.src=url+`?t=${Date.now()}`;
  });
}
async function loadSelectedTargetArea() {
  const product=selectedProduct();
  if(product.mode!=="target")return;
  const d=selectedImageTime();
  const area=Number($("targetArea").value);
  if(!d || !area)return;
  const token=++requestToken;
  $("errorBox").style.display="none";$("errorBox").textContent="";
  $("loadbar").style.width="65%";$("imageStatus").textContent="正在加载…";
  $("imageWrap").innerHTML='<div class="placeholder">正在请求卫星图像…</div>';
  const url=makeTargetAreaUrl(product.code,d,area);
  $("regionBadge").textContent=`Target Area ${area}`;
  $("sourceBadge").textContent="JMA 日本气象厅";
  const ok=await displayImage(url,`JMA ${product.label} Target Area ${area}`,token,d,`Target Area ${area}`,product);
  if(token!==requestToken)return;
  if(!ok)showError(`Target Area ${area} 图像加载失败。请重新获取或选择其他时次。`);
}
async function loadImage() {
  const token=++requestToken, product=selectedProduct(), region=$("region").value;
  const isTarget=product.mode==="target";
  const regionInfo=JMA_REGIONS.find(r=>r.value===region)||JMA_REGIONS[0];
  const displayRegion=isTarget?"JMA Target Area":regionInfo.label;
  const d=selectedImageTime();
  $("errorBox").style.display="none";$("errorBox").textContent="";
  $("loadbar").style.width="8%";$("imageStatus").textContent="正在加载…";
  $("imageTitle").textContent=product.label;
  $("regionBadge").textContent=displayRegion;
  $("sourceBadge").textContent=isTarget?"JMA 日本气象厅":"JMA 日本气象厅";
  $("imageWrap").innerHTML='<div class="placeholder">正在请求卫星图像…</div>';
  updateProductNote();
  if(!d){showError("请选择有效的图像日期和时间。");return;}
  $("requestInfo").textContent=`选择时次：${formatTime(d)} · ${displayRegion} · ${product.value}`;
  if(isTarget){
    $("imageStatus").textContent="正在自动检测 Target Area…";
    $("targetArea").disabled=true;
    $("targetArea").innerHTML='<option value="">正在检测可用区域…</option>';
    const areas=await detectTargetAreas(product,d,token);
    if(token!==requestToken)return;
    detectedTargetAreas=areas;
    updateTargetAreaOptions(areas);
    $("targetArea").disabled=!areas.length;
    if(!areas.length){
      showError(`在所选时次 ${formatTime(d)} 未检测到可用的 ${product.label} Target Area 图像。请尝试选择其他时次。`);
      $("requestInfo").textContent=`未检测到图像 · ${formatTime(d)}`;
      return;
    }
    $("loadbar").style.width="65%";
    const area=Number($("targetArea").value);
    const url=makeTargetAreaUrl(product.code,d,area);
    $("regionBadge").textContent=`Target Area ${area}`;
    const ok=await displayImage(url,`JMA ${product.label} Target Area ${area}`,token,d,`Target Area ${area}`,product);
    if(token!==requestToken)return;
    if(!ok)showError(`Target Area ${area} 图像加载失败。请重新获取或选择其他时次。`);
    return;
  }
  const url=jmaImageUrl(region,product.value,d);
  const ok=await displayImage(url,`JMA ${regionInfo.label} ${product.label}`,token,d,displayRegion,product);
  if(token!==requestToken)return;
  if(!ok)showError(`所选时次 ${formatTime(d)} 的「${displayRegion} / ${product.label}」图像无法加载。请检查时次、区域或产品是否有数据，然后重新获取。`);
}
$("region").addEventListener("change",()=>{populateProducts();loadImage();});
$("product").addEventListener("change",()=>{updateProductMode();updateProductNote();loadImage();});
$("imageTime").addEventListener("change",loadImage);
$("targetArea").addEventListener("change",loadSelectedTargetArea);
$("refresh").addEventListener("click",loadImage);
$("apply").addEventListener("click",loadImage);
function clock(){$("clock").textContent="现在是 "+new Intl.DateTimeFormat("zh-CN",{hour12:false,dateStyle:"medium",timeStyle:"medium"}).format(new Date());}

/* ==========================================================================
   手机端增强：仅在 IS_MOBILE 为真时执行，电脑端不会创建任何多余元素
   ========================================================================== */
function initMobileEnhancements(){
  if(!IS_MOBILE) return;

  // 1) 把「真实可视高度」写入 --app-vh，供 CSS 计算图像最大高度。
  //    手机浏览器地址栏收起/展开、横竖屏切换时同步更新，避免图片被裁切。
  const setAppHeight=()=>{
    document.documentElement.style.setProperty("--app-vh",(window.innerHeight*0.01)+"px");
  };
  setAppHeight();
  window.addEventListener("resize",setAppHeight);
  window.addEventListener("orientationchange",()=>setTimeout(setAppHeight,250));
  if(window.visualViewport){
    window.visualViewport.addEventListener("resize",setAppHeight);
  }

  // 2) 点按云图 → 全屏查看（小屏看细节更清楚）
  const box=document.createElement("div");
  box.className="lightbox";
  box.innerHTML='<img alt=""><button type="button" class="lightbox-close" aria-label="关闭">✕</button><span class="lightbox-hint">点击空白处关闭</span>';
  document.body.appendChild(box);
  const boxImg=box.querySelector("img");

  const openLightbox=(src,alt)=>{
    boxImg.src=src;
    boxImg.alt=alt||"";
    box.classList.add("open");
    document.body.style.overflow="hidden";
  };
  const closeLightbox=()=>{
    box.classList.remove("open");
    document.body.style.overflow="";
    boxImg.removeAttribute("src");
  };

  box.addEventListener("click",e=>{
    if(e.target===boxImg) return;   // 点在图片上不关闭
    closeLightbox();
  });
  document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeLightbox(); });

  // 事件委托：图像每次刷新都会被替换，绑在容器上即可持续生效
  $("imageWrap").addEventListener("click",e=>{
    const target=e.target;
    const img=target && target.closest ? target.closest("img") : null;
    if(!img || !img.src) return;
    openLightbox(img.src,img.alt);
  });
}

clock();setInterval(clock,1000);initializeImageTime();populateRegions();populateProducts();loadImage();
initMobileEnhancements();
</script>
